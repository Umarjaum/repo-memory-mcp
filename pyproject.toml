[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-memory-mcp-ai"
version = "0.2.0"
description = "Persistent local memory for AI coding agents via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "repo-memory contributors" }]
keywords = ["mcp", "ai", "coding-agents", "memory", "sqlite", "developer-tools"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries"]
dependencies = ["mcp>=1.8.0,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
repo-memory = "repo_memory_mcp.cli:main"
repo-memory-mcp = "repo_memory_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_memory_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
